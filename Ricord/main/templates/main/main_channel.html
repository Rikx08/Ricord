<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricord</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/css/main_channel_style.css' %}" >
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.js"></script>
    <div id="img-modal" class="modal" style="display: none;">
        <span class="close">&times;</span>
        <img class="modal-content" id="img-modal-content">
    </div>
</head>
    <!-- Модалка для увеличенного изображения -->

<body>

    <div class="container">
        <aside class="servers">
            <div class="server" onclick="location.href='{% url 'home' %}'">🏠</div>
            <div class="server">🎮</div>
            <div class="server">🎵</div>
            <div class="server" onclick="location.href='{% url 'channel' %}'">💻</div>
        </aside>
        <aside class="channels">
            <h2>Каналы</h2>
            <ul>
                <li data-room="common_room">общий</li>
                <li data-room="shitpost"> щитпост</li>
                <li data-room="quotes"> цитаты</li>
                <li data-room="referendum"> референдум</li>
            </ul>
        <div class="line"></div>
            <div class="voice-channels">
                    <section class="voice-channels-list">
                        <div class="friend online" id="voice-channel-basic" data-room="voice_channel_1"> Основной</div>
                        <div class="friend offline" id="voice-channel-classic" data-room="voice_channel_2"> класика 100</div>
                        <div class="friend online" id="voice-channel-gatherings" data-room="voice_channel_3"> посиделки</div>
                    </section>
                </div>
            <div class="nav_niz">
            <div class="voice-chat">
                <div class="title">Голосовая связь под</div>
                <div class="subtitle">сесбийский лекс / УТОПИЯ</div>
                <div class="voice-controls">
                    <button>✏️</button>
                    <button>📷</button>
                    <button>☀️</button>
                </div>
            </div>
            <div class="user-panel">
                <div class="user-info">
                    <button class="user-button" onclick="location.href='{% url 'profile' %}'">
                    <img src="{% static 'media/avatars/default.jpg' %}" alt="Аватар">
                    <div class="username">{{ user.username }}</div>
                    </button>
                </div>
                <div class="user-controls">
                    <button>💀</button>

                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                    <button type="submit">🎤</button>
                    </form>

                    <button>⚙️</button>
                </div>
            </div>
        </div>
        </aside>
        <main class="chat">
            <header>Общий чат</header>
            <section class="messages" id="messages"></section>
            <div class="messageInput">
                <div id="imagePreviewContainer" class="image-preview-container"></div>
                <div class="input-row">
                    <label for="imageInput" class="attach-button" title="Прикрепить изображение">🖇️</label>
                    <textarea id="messageInput" placeholder="Введите сообщение..."></textarea>
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </main>
        <aside class="users">
            <h2>Пользователи</h2>
            <ul>
                <li>Пользователь1</li>
                <li>Пользователь2</li>
                <li>Пользователь3</li>
            </ul>
        </aside>
    </div>

    <script>

    var socket = io('http://localhost:5000', {
        extraHeaders: {
            "user_id": {{ user.id }}
            }
        });

        let currentRoom = 'common_room';

        document.querySelectorAll('aside.channels li').forEach(li => {
          li.addEventListener('click', () => {
            const newRoom = li.dataset.room;
            if (newRoom !== currentRoom) {
              socket.emit('join', newRoom);
              currentRoom = newRoom;

              // Очистить чат
              document.getElementById('messages').innerHTML = '';

              // Обновить заголовок
              document.querySelector('main.chat header').textContent = li.textContent.trim();
            }
          });
        });

        // Функция обработки клика по изображениям в сообщениях
        document.addEventListener("click", function (event) {
            if (event.target.classList.contains("message-image")) {
                const modal = document.getElementById("img-modal");
                const modalImg = document.getElementById("img-modal-content");
                modal.style.display = "block";
                modalImg.src = event.target.src;
            }
        });

        // Закрытие модалки по кнопке
        document.querySelector(".close").addEventListener("click", function () {
            document.getElementById("img-modal").style.display = "none";
        });

        socket.emit('join', 'common_room');
        function scrollToBottom() {
            const messages = document.getElementById('messages');

            // Ждём окончания загрузки изображений
            const images = messages.querySelectorAll('img');
            if (images.length === 0) {
                messages.scrollTop = messages.scrollHeight;
            } else {
                let loaded = 0;
                images.forEach(img => {
                    if (img.complete) {
                        loaded++;
                    } else {
                        img.onload = img.onerror = () => {
                            loaded++;
                            if (loaded === images.length) {
                                messages.scrollTop = messages.scrollHeight;
                            }
                        };
                    }
                });
                if (loaded === images.length) {
                    messages.scrollTop = messages.scrollHeight;
                }
            }};




        let previewImageDataUrl = null;

        // Показывает превью изображения
        function showImagePreview(dataUrl) {
            previewImageDataUrl = dataUrl;
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = `
                <div style="position: relative;">
                    <img src="${dataUrl}" style="max-width: 150px; max-height: 150px; border: 1px solid #ccc; border-radius: 6px;">
                    <button onclick="removeImagePreview()">❌</button>
                </div>
            `;
        }

        function removeImagePreview() {
            previewImageDataUrl = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').innerHTML = '';
        }
        // Обработчик нового сообщения от сервера
        socket.on('message', function (data) {
        var messages = document.getElementById('messages');
        var item = document.createElement('div');
        item.classList.add('message');

        // Создаем аватар
        var avatar = document.createElement('img');
        avatar.src = "{% static 'media/avatars/default.jpg' %}";
        avatar.classList.add('avatar');

        // Создаем контейнер для текста
        var content = document.createElement('div');
        content.classList.add('content');

        // Имя пользователя
        var username = document.createElement('div');
        username.classList.add('username');
        username.textContent = data.user;

        // Текст сообщения
        var text = document.createElement('div');
        text.classList.add('text');
        text.textContent = data.message;

        content.appendChild(username);
        content.appendChild(text);

        // Обработка изображений
        if (data.image) {
            console.log("Image source: ", data.image);
            var image = document.createElement('img');
            console.log("Image source: ", data.image); // Логируем путь картинки
            image.src = data.image; 
            image.classList.add('message-image');
            content.appendChild(image);
        }

        item.appendChild(avatar);
        item.appendChild(content);
        messages.appendChild(item);

        scrollToBottom();
    });

        // Функция отправки сообщения
        function sendMessage() {
            var messageInput = document.getElementById('messageInput');
            var imageInput = document.getElementById('imageInput');

            var message = messageInput.value.trim();
            var file = imageInput.files[0];

            if (message === "" && !file) return;

            if (file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var imageBase64 = e.target.result;

                    // Отправка серверу
                    socket.emit('message', {
                        message: message,
                        image: imageBase64
                    });

                    // Отображение сообщения сразу с изображением
                    var item = document.createElement('div');
                    item.classList.add('message', 'self-message');

                    var avatar = document.createElement('img');
                    avatar.src = "{% static 'media/avatars/default.jpg' %}";
                    avatar.classList.add('avatar');

                    var content = document.createElement('div');
                    content.classList.add('content');

                    var username = document.createElement('div');
                    username.classList.add('username');
                    username.textContent = "Вы";

                    var text = document.createElement('div');
                    text.classList.add('text');
                    text.textContent = message;

                    content.appendChild(username);
                    content.appendChild(text);

                    var image = document.createElement('img');
                    image.src = imageBase64;
                    image.classList.add('message-image');
                    content.appendChild(image);

                    item.appendChild(avatar);
                    item.appendChild(content);
                    messages.appendChild(item);

                    scrollToBottom();
                    messageInput.value = '';
                    imageInput.value = '';
                    removeImagePreview();
                };
                reader.readAsDataURL(file);
            } else {
                socket.emit('message', {
                    message: message,
                    image: null
                });

                // Отображение текстового сообщения без изображения
                var item = document.createElement('div');
                item.classList.add('message', 'self-message');

                var avatar = document.createElement('img');
                avatar.src = "{% static 'media/avatars/default.jpg' %}";
                avatar.classList.add('avatar');

                var content = document.createElement('div');
                content.classList.add('content');

                var username = document.createElement('div');
                username.classList.add('username');
                username.textContent = "Вы";

                var text = document.createElement('div');
                text.classList.add('text');
                text.textContent = message;

                content.appendChild(username);
                content.appendChild(text);

                item.appendChild(avatar);
                item.appendChild(content);
                messages.appendChild(item);

                scrollToBottom();
                messageInput.value = '';
                imageInput.value = '';
                removeImagePreview();
            }
        }
         // Обработка выбора изображения
        document.getElementById('imageInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                showImagePreview(e.target.result);
            };
            reader.readAsDataURL(file);
        });

        // Обработка вставки Ctrl+V скриншота
        document.getElementById('messageInput').addEventListener('paste', function (e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (const item of items) {
                if (item.type.indexOf("image") === 0) {
                    const file = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        showImagePreview(event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            }
        });
        document.getElementById('messageInput').addEventListener('keydown', function(event) {
            if (event.key === "Tab") {
                event.preventDefault();

                const textarea = this;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;

                // Вставить таб
                textarea.value = textarea.value.substring(0, start) + "\t" + textarea.value.substring(end);

                // Переместить курсор после таба
                textarea.selectionStart = textarea.selectionEnd = start + 1;
            }

            // Обработка отправки по Enter
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        const textarea = document.getElementById("messageInput");

        textarea.addEventListener("input", () => {
            textarea.style.height = "auto";
            textarea.style.height = textarea.scrollHeight + "px";
        });
        // обработка закрытия картинки на Esc
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                const modal = document.getElementById("img-modal");
                if (modal && modal.style.display === "block") {
                    modal.style.display = "none";
                }
            }
        });



    // голосовой канал↓

    document.getElementById('voice-channel-basic').addEventListener('click', () => {
        joinVoiceRoom('main_voice_channel');
    });

    let localStream;
    let peerConnections = {};

    async function getMicrophoneStream() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
            console.error('Ошибка доступа к микрофону:', err);
        }
    }

    async function joinVoiceRoom(roomName) {
        await getMicrophoneStream();
        socket.emit('join_voice_room', roomName);
    }

    // Когда кто-то новый присоединяется
    socket.on('user_joined', async ({ userId }) => {
        const pc = new RTCPeerConnection();
        peerConnections[userId] = pc;

        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('ice_candidate', { to: userId, candidate: event.candidate });
            }
        };

        pc.ontrack = (event) => {
            const audio = document.createElement('audio');
            audio.srcObject = event.streams[0];
            audio.autoplay = true;
            document.body.appendChild(audio);
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('offer', { to: userId, offer });
    });

    socket.on('offer', async ({ from, offer }) => {
        const pc = new RTCPeerConnection();
        peerConnections[from] = pc;

        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('ice_candidate', { to: from, candidate: event.candidate });
            }
        };

        pc.ontrack = (event) => {
            const audio = document.createElement('audio');
            audio.srcObject = event.streams[0];
            audio.autoplay = true;
            document.body.appendChild(audio);
        };

        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit('answer', { to: from, answer });
    });

    socket.on('answer', async ({ from, answer }) => {
        const pc = peerConnections[from];
        if (pc) {
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }
    });

    socket.on('ice_candidate', ({ from, candidate }) => {
        const pc = peerConnections[from];
        if (pc && candidate) {
            pc.addIceCandidate(new RTCIceCandidate(candidate));
        }
    });
    </script>

</body>
</html>
