<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricord</title>
    {% load static %}
   <link rel="stylesheet" href="{% static 'main/css/main_style.css' %}" >
</head>
<body>
    <div class="container">
        <aside class="servers">
            <div class="server" onclick="location.href='{% url 'home' %}'">🏠</div>
            <div class="server">🎮</div>
            <div class="server">🎵</div>
            <div class="server" onclick="location.href='{% url 'channel' %}'">💻</div>
        </aside>
        <aside class="channels">
            <h2> Дом </h2>
            <nav class="friends">
                <ul>
                    <li class="active"><img src="{% static 'media/ico/friends_ico.png' %}"alt=""> Друзья</li>
                    <li><img src="{% static 'media/ico/steam.png' %}" alt=""> Nitro</li>
                    <li><img src="{% static 'media/ico/shop.png' %}" alt=""> Магазин</li>
                </ul>
            </nav>
                <div class="friends-list-container">
                    <section class="friends-list">
                        <div class="friend online"><img src="avatar1.jpg" alt=""> emod3vochka</div>
                        <div class="friend offline"><img src="avatar2.jpg" alt=""> K_ofe</div>
                        <div class="friend online"><img src="avatar3.jpg" alt=""> Sokolova</div>
                        <div class="friend online"><img src="avatar4.jpg" alt=""> Стас Шишов</div>
                        <div class="friend online"><img src="avatar1.jpg" alt=""> emod3vochka</div>
                        <div class="friend offline"><img src="avatar2.jpg" alt=""> K_ofe</div>
                        <div class="friend online"><img src="avatar3.jpg" alt=""> Sokolova</div>
                        <div class="friend online"><img src="avatar4.jpg" alt=""> Стас Шишов</div>
                        <div class="friend online"><img src="avatar1.jpg" alt=""> emod3vochka</div>
                        <div class="friend offline"><img src="avatar2.jpg" alt=""> K_ofe</div>
                        <div class="friend online"><img src="avatar3.jpg" alt=""> Sokolova</div>
                        <div class="friend online"><img src="avatar4.jpg" alt=""> Стас Шишов</div>
                        <div class="friend online"><img src="avatar1.jpg" alt=""> emod3vochka</div>
                        <div class="friend offline"><img src="avatar2.jpg" alt=""> K_ofe</div>
                        <div class="friend online"><img src="avatar3.jpg" alt=""> Sokolova</div>
                        <div class="friend online"><img src="avatar4.jpg" alt=""> Стас Шишов</div>
                    </section>
                </div>
        <div class="nav_niz">
            <div class="voice-chat">
                <div class="title">Голосовая связь под</div>
                <div class="subtitle">сесбийский лекс / УТОПИЯ</div>
                <div class="voice-controls">
                    <button>✏️</button>
                    <button>📷</button>
                    <button>☀️</button>
                </div>
            </div>
            <div class="user-panel">
                <div class="user-info">
                    <button class="user-button" onclick="location.href='{% url 'profile' %}'">
                    <img src="{% static 'media/avatars/default.jpg' %}" alt="Аватар">
                    <div class="username">{{ user.username }}</div>
                    </button>
                </div>
                <div class="user-controls">
                    <button>💀</button>

                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                    <button type="submit">🎤</button>
                    </form>

                    <button>⚙️</button>
                </div>
            </div>
        </div>
        </aside>
        <main class="content">
            <header>
                <input id="search-input" type="text" placeholder="Найти пользователя...">
            </header>
            <section id="search-results" class="friends-list"></section>

        </main>
    </div>
    <script>
        document.getElementById("search-input").addEventListener("input", function() {
    let query = this.value;

    fetch(`/main/search-users/?q=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById("search-results");
            container.innerHTML = "";

            data.users.forEach(user => {
                const div = document.createElement("div");
                div.className = "friend online";
                div.innerHTML = `
                <div class="friend-inner">
                    <div class="friend-info">
                        <img src="/static/media/avatars/default.jpg" alt="">
                        <span class="username">${user.username}</span>
                    </div>
                    <button class="add-friend">Добавить</button>
                </div>
            `;
                container.appendChild(div);
            });
        });
});

    </script>

    </div>
</body>
</html>
